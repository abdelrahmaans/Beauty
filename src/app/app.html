<div class="app-layout" [class.admin-layout-active]="isAdminRoute()">
  <!-- Global Navbar (Hidden on Admin pages) -->
  <app-navbar *ngIf="!isAdminRoute()"></app-navbar>

  <!-- Main View Routing Outlet -->
  <main class="main-content" [class.admin-main-reset]="isAdminRoute()">
    <router-outlet></router-outlet>
  </main>

  <!-- Global Slide-in Cart Drawer (Hidden on Admin) -->
  <app-cart-drawer *ngIf="!isAdminRoute()"></app-cart-drawer>

  <!-- Global Footer & Trust Badges (Hidden on Admin) -->
  <app-footer *ngIf="!isAdminRoute()"></app-footer>
</div>
